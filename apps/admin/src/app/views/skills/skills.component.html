<!-- Skills Container -->
<div class="space-y-4 md:space-y-0 md:grid md:grid-cols-12 md:gap-6">

   <!-- Skills List -->
   <div class="md:col-span-2">
      <div class="card">
         <div class="card-header">
            <h2 class="card-title">Skills</h2>
         </div>
         <div class="card-body">
            <app-skill-list/>
         </div>
      </div>
   </div>

   <!-- Skill Detail -->
   @if (skillId$ | async; as skillId) {
      <div class="md:col-span-8">
         <div class="card">
         <div class="card-header">
            <h2 class="card-title">Skill Detail</h2>
         </div>
         <div class="card-body">
            <router-outlet></router-outlet>
         </div>
         </div>
      </div>   
   }

</div>
