<h1>Clients</h1>
<hr class="mb-6 border-gray-700/50" />

<div *ngIf="error$()" class="text-red-400">{{ error$() }}</div>

<!-- Client Container -->
<div *ngIf="!error$()">
   <div class="space-y-4 md:space-y-0 md:grid md:grid-cols-12 md:gap-6">
      
      <!-- Client List -->
      <div class="md:col-span-4">
         <div class="card">
            <div class="card-header">
               <h2 class="card-title">Client List</h2>
            </div>
            <div class="card-body">
               <app-client-list [clients]="clients$()"></app-client-list>
            </div>
         </div>
      </div>

      <!-- Client Detail -->
      <div class="md:col-span-8">
         <router-outlet></router-outlet>
      </div>
   </div>
</div>
